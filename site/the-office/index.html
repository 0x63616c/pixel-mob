<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Office · coming soon · Pixel Mob</title>
<meta name="description" content="A tiny pixel office simulation from Pixel Mob is on its way.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<meta name="theme-color" content="#f4f2ee">
<style>
:root{--ink:#2d2420;--paper:#f4f2ee;--card:#fffdf8;--accent:#e2483d;--sh-btn:-4px 4px 0;--sh-press:-1px 1px 0;--sh-card:-6px 6px 0}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif;padding:24px}
main{width:min(440px,100%);background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh-card) var(--ink);padding:28px;text-align:center}
img{image-rendering:pixelated}.eyebrow{font:700 11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;color:var(--accent);margin-top:22px}h1{font-size:30px;letter-spacing:-.045em;line-height:1.1;margin:8px 0 10px}p{color:#746c62;margin:0 0 22px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650;box-shadow:var(--sh-btn) #120d0a;transition:transform .08s,box-shadow .08s}
a:active{transform:translate(-2px,2px);box-shadow:var(--sh-press) #120d0a}a:focus-visible{outline:3px solid #3a7bd5;outline-offset:3px}
</style>
</head>
<body><main><img src="/logo.svg" width="108" height="60" alt=""><div class="eyebrow">THE OFFICE · COMING SOON</div><h1>The mob is clocking in.</h1><p>A tiny pixel office is being set up. Desks are being straightened. Nobody knows what the numbers mean.</p><a href="/">Back to Pixel Mob</a></main></body>
</html>
