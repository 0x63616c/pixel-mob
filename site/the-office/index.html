<title>The Floor — a pixel office</title>

<script type="module">

<style>
  html,body{margin:0;height:100%;background:#f6f5f1;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#bevy{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;image-rendering:pixelated}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#ffffff 0%,#f6f5f1 55%,#e6e4dc 100%);z-index:10;transition:opacity .9s ease;font-family:"Courier New",monospace}
  #loader.gone{opacity:0;pointer-events:none}
  .term{background:#0b0f0c;color:#7cf2a0;border:6px solid #d8cfb4;border-radius:18px;box-shadow:0 0 0 3px #b8ad8f,0 18px 50px rgba(0,0,0,.25),inset 0 0 40px rgba(124,242,160,.15);padding:22px 26px;width:min(78vw,380px);position:relative;overflow:hidden}
  .term:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);pointer-events:none}
  .logo{font-family:Georgia,serif;letter-spacing:.35em;font-size:13px;color:#a8f7c2;opacity:.85;margin-bottom:14px;text-align:center}
  .line{font-size:14px;line-height:1.6;white-space:nowrap;overflow:hidden;text-shadow:0 0 6px rgba(124,242,160,.7)}
  .bar{margin-top:14px;height:10px;border:1px solid #7cf2a0;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#7cf2a0;box-shadow:0 0 10px #7cf2a0;animation:fill 9s cubic-bezier(.2,.7,.3,1) forwards}
  .cur{display:inline-block;width:8px;height:14px;background:#7cf2a0;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes fill{to{width:94%}} @keyframes blink{50%{opacity:0}}
  .err{color:#ffb38a}
  #seed{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;background:rgba(8,20,16,.78);border:1px solid rgba(216,205,176,.55);border-radius:3px;font:12px/1 "Courier New",monospace;letter-spacing:.12em;color:#5f9f7a;box-shadow:-2px 3px 0 rgba(0,0,0,.12)}
  #seed input{width:8.5ch;background:transparent;border:0;border-bottom:1px dashed rgba(124,242,160,.35);color:#7cf2a0;font:inherit;letter-spacing:.05em;padding:2px 0;outline:none;-webkit-user-select:text;user-select:text}
  #seed input:focus{border-bottom-color:#7cf2a0}
  #seed button{background:transparent;border:1px solid rgba(124,242,160,.35);color:#7cf2a0;font:inherit;padding:2px 6px;border-radius:2px;cursor:pointer}
  #seed button:hover{background:rgba(124,242,160,.12)}
</style>

<body>
<div id="loader"><div class="term">
  <div class="logo">— THE FLOOR —</div>
  <div class="line" id="l1">&gt; descending to your floor...</div>
  <div class="line" id="l2">&gt; calibrating the numbers</div>
  <div class="line" id="l3">&gt; please enjoy each metric equally <span class="cur"></span></div>
  <div class="bar"><i></i></div>
</div></div>
<form id="seed" title="Same seed, same day. Change it to start a new run."><label for="seedin">SEED</label><input id="seedin" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="9"><button type="submit" title="start this seed">GO</button><button type="button" id="seedrnd" title="new random run">NEW</button></form>
<canvas id="bevy"></canvas>
<script>
  // seed lives in the URL (?seed=): a missing / bad seed gets a fresh random one so every visit is a new, shareable run
  (function(){
    const u = new URL(location.href); let s = u.searchParams.get('seed');
    if (!s || !/^\d{1,9}$/.test(s)) { s = String(1 + Math.floor(Math.random() * 999998)); u.searchParams.set('seed', s); history.replaceState(null, '', u); }
    const f = document.getElementById('seed'), i = document.getElementById('seedin'); i.value = s;
    if (u.searchParams.get('ui') === '0') f.style.display = 'none';
    const go = v => { v = String(v).replace(/\D/g, '').slice(0, 9); if (!v) return; const n = new URL(location.href); n.searchParams.set('seed', v); location.assign(n); };
    f.addEventListener('submit', e => { e.preventDefault(); go(i.value); });
    document.getElementById('seedrnd').addEventListener('click', () => go(1 + Math.floor(Math.random() * 999998)));
    // keys typed in the box are for the box, not the sim
    ['keydown','keyup','keypress'].forEach(k => i.addEventListener(k, e => e.stopPropagation()));
  })();
</script>
<script>
  // Prevent iOS page bounce / double-tap zoom while the sim owns the canvas.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.target.id === 'bevy') e.preventDefault(); }, {passive:false});
  window.__hideLoader = () => { const l = document.getElementById('loader'); if (l) { l.classList.add('gone'); setTimeout(() => l.remove(), 1000); } };
  window.addEventListener('error', e => { const l = document.getElementById('l3'); if (l) { l.className='line err'; l.textContent = '> error: ' + (e.message||'').slice(0,60); } });
  if (!document.createElement('canvas').getContext('webgl2')) { setTimeout(()=>{const l=document.getElementById('l3'); if(l){l.className='line err'; l.textContent='> WebGL2 unavailable on this device';}},300); }
</script>
</body>
